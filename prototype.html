<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>SSS Run — Prototype</title>

<!-- Leaflet -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<!-- Inter font -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
/* ═══════════════════════════════════════════════════
   RESET
═══════════════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  overflow: hidden;
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: #e5e5ea;
  -webkit-font-smoothing: antialiased;
}

/* ═══════════════════════════════════════════════════
   APP SHELL  (phone frame centrado)
═══════════════════════════════════════════════════ */
#app {
  position: relative;
  width: 100%;
  max-width: 430px;
  height: 100%;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  background: #fff;
  overflow: hidden;
  box-shadow: 0 0 60px rgba(0,0,0,.18);
}

/* ═══════════════════════════════════════════════════
   HEADER
═══════════════════════════════════════════════════ */
#header {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 18px 10px;
  background: #fff;
}
.logo {
  font-size: 22px;
  font-weight: 900;
  letter-spacing: -0.8px;
  color: #111;
  flex: 1;
}
.logo em { font-style: normal; color: #2a9e2a; }

.score-pill {
  display: flex;
  align-items: center;
  gap: 5px;
  background: #f4f4f5;
  border-radius: 20px;
  padding: 5px 12px;
  font-size: 13px;
  font-weight: 700;
  color: #111;
}
.score-pill b { color: #2a9e2a; }

.avatar-wrap {
  position: relative;
  cursor: pointer;
  flex-shrink: 0;
}
.avatar-circle {
  width: 38px; height: 38px;
  border-radius: 50%;
  background: linear-gradient(135deg, #2a9e2a, #1a761a);
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 800; color: #fff;
  box-shadow: 0 2px 8px rgba(42,158,42,.25);
}
.lvl-badge {
  position: absolute;
  bottom: -2px; right: -2px;
  width: 16px; height: 16px;
  border-radius: 50%;
  background: #2a9e2a;
  border: 2px solid #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 8px; font-weight: 800; color: #fff;
}

/* ═══════════════════════════════════════════════════
   HEALTH BAR
═══════════════════════════════════════════════════ */
#hp-wrap {
  flex-shrink: 0;
  padding: 2px 18px 10px;
  background: #fff;
}
.hp-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 4px;
}
.hp-row span { font-size: 11px; font-weight: 600; color: #999; letter-spacing: .3px; }
.hp-track {
  height: 6px;
  background: #f0f0f3;
  border-radius: 3px;
  overflow: hidden;
}
.hp-fill {
  height: 100%;
  border-radius: 3px;
  background: linear-gradient(90deg, #2a9e2a, #5cc85c);
  transition: width .5s ease;
}

/* ═══════════════════════════════════════════════════
   TABS  (iOS pill segmented control)
═══════════════════════════════════════════════════ */
#tabs {
  flex-shrink: 0;
  padding: 8px 18px 10px;
  background: #fff;
  border-bottom: 1px solid #f0f0f3;
}
.tab-pill-wrap {
  display: flex;
  background: #f2f2f5;
  border-radius: 10px;
  padding: 3px;
}
.tab-pill {
  flex: 1;
  padding: 7px 0;
  border: none;
  border-radius: 8px;
  background: transparent;
  font-size: 13px;
  font-weight: 600;
  color: #888;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  transition: background .2s, color .2s, box-shadow .2s;
}
.tab-pill.active {
  background: #fff;
  color: #111;
  box-shadow: 0 1px 4px rgba(0,0,0,.13);
}

/* ═══════════════════════════════════════════════════
   CONTENT AREA  (map + friends panel stack)
═══════════════════════════════════════════════════ */
#content {
  flex: 1;
  position: relative;
  overflow: hidden;
  min-height: 0;
}

/* Real Leaflet map */
#map {
  position: absolute;
  inset: 0;
  z-index: 0;
}
.leaflet-control-attribution { font-size: 8px !important; }

/* Swipe hint toast */
#swipe-hint {
  position: absolute;
  bottom: 14px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(20,20,20,.6);
  backdrop-filter: blur(6px);
  color: #fff;
  font-size: 11px;
  font-weight: 500;
  padding: 6px 14px;
  border-radius: 20px;
  z-index: 20;
  pointer-events: none;
  opacity: 0;
  transition: opacity .4s;
  white-space: nowrap;
}
#swipe-hint.show { opacity: 1; }

/* Friends / groups panel (slides in from right) */
#friends-panel {
  position: absolute;
  inset: 0;
  z-index: 10;
  background: rgba(250,250,252,.97);
  backdrop-filter: blur(18px);
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  transform: translateX(100%);
  transition: transform .3s cubic-bezier(.4,0,.2,1);
}
#friends-panel.visible { transform: translateX(0); }

.fp-section { padding: 14px 16px 0; }
.fp-title {
  font-size: 11px;
  font-weight: 700;
  color: #aaa;
  letter-spacing: .9px;
  text-transform: uppercase;
  margin-bottom: 10px;
}

/* Friend card */
.friend-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 14px;
  background: #fff;
  border-radius: 14px;
  margin-bottom: 8px;
  border: 1px solid #ececf0;
  box-shadow: 0 1px 3px rgba(0,0,0,.05);
}
.fa-wrap { position: relative; flex-shrink: 0; }
.fa-circle {
  width: 42px; height: 42px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 17px; font-weight: 800;
  border: 2.5px solid;
}
.online-dot {
  position: absolute;
  bottom: 0; right: 0;
  width: 11px; height: 11px;
  border-radius: 50%;
  background: #2ecc71;
  border: 2.5px solid #fff;
}
.online-dot.off { background: #ccc; }
.fi { flex: 1; min-width: 0; }
.fi-name { font-size: 14px; font-weight: 700; color: #111; }
.fi-sub { font-size: 11px; color: #999; margin-top: 2px; display: flex; gap: 8px; }
.chips { display: flex; flex-direction: column; gap: 3px; }
.chip {
  background: #f4f4f6;
  border-radius: 8px;
  padding: 3px 8px;
  font-size: 11px;
  font-weight: 700;
  color: #444;
  text-align: right;
}

/* Group card */
.group-card {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 11px 14px;
  background: #fff;
  border-radius: 14px;
  margin-bottom: 8px;
  border: 1px solid #ececf0;
  box-shadow: 0 1px 3px rgba(0,0,0,.05);
}
.gc-emoji { font-size: 26px; flex-shrink: 0; }
.gc-info { flex: 1; min-width: 0; }
.gc-name {
  font-size: 14px; font-weight: 700; color: #111;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.gc-meta { font-size: 11px; color: #999; margin-top: 2px; display: flex; gap: 8px; }
.gc-active { color: #2a9e2a; font-weight: 600; }
.join-btn {
  flex-shrink: 0;
  padding: 7px 16px;
  border-radius: 20px;
  border: 1.5px solid #2a9e2a;
  background: transparent;
  color: #2a9e2a;
  font-size: 12px; font-weight: 700;
  cursor: pointer;
  font-family: 'Inter', sans-serif;
  transition: all .15s;
}
.join-btn.joined { background: #2a9e2a; color: #fff; }

/* ═══════════════════════════════════════════════════
   MAP PLAYER MARKERS
═══════════════════════════════════════════════════ */
.pm-head {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: #fff;
  border: 3px solid;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 900;
  box-shadow: 0 2px 8px rgba(0,0,0,.22);
  cursor: pointer;
}

/* ═══════════════════════════════════════════════════
   BOTTOM NAV AREA
   ─────────────────────────────────────────────────
   Geometry (all Y in SVG viewBox 0 0 430 88):
     • nav-area height     = 88 px
     • flat nav top        = y 28
     • PLAY btn ⌀72        → bottom:12px → center y = 88-12-36 = 40
     • button top edge     = 40-36 = 4  →  notch apex = y 4
     • notch half-width ≈ 36 → from x 179 to x 251
═══════════════════════════════════════════════════ */
#nav-area {
  flex-shrink: 0;
  position: relative;
  height: 88px;
}

/* Snake canvas — above SVG fill, below PLAY btn */
#snake-canvas {
  position: absolute;
  inset: 0;
  width: 100%; height: 100%;
  z-index: 22;
  pointer-events: none;
}

/* SVG curved bar */
#nav-svg {
  position: absolute;
  inset: 0;
  width: 100%; height: 100%;
  z-index: 20;
  pointer-events: none;
}

/* Nav buttons */
#nav-btns {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: flex-end;
  padding: 0 16px 10px;
  z-index: 24;
}
.nav-btn {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  background: none; border: none;
  cursor: pointer;
  color: #c0c0c8;
  transition: color .2s;
  font-family: 'Inter', sans-serif;
}
.nav-btn.active { color: #2a9e2a; }
.nav-icon {
  width: 22px; height: 22px;
  stroke-width: 2; fill: none;
  stroke: currentColor;
  stroke-linecap: round; stroke-linejoin: round;
}
.nav-label { font-size: 10px; font-weight: 600; letter-spacing: .2px; }
.nav-notch { width: 96px; flex-shrink: 0; }

/* PLAY button */
#play-btn {
  position: absolute;
  bottom: 12px;
  left: 50%;
  transform: translateX(-50%);
  width: 72px; height: 72px;
  border-radius: 50%;
  background: linear-gradient(150deg, #34c534, #1a841a);
  border: 4px solid #fff;
  box-shadow: 0 6px 24px rgba(42,158,42,.38), 0 2px 8px rgba(0,0,0,.1);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  z-index: 30;
  transition: transform .12s ease, box-shadow .2s ease;
}
#play-btn:active {
  transform: translateX(-50%) scale(.91);
  box-shadow: 0 2px 10px rgba(42,158,42,.25);
}
.play-tri {
  width: 0; height: 0;
  border-top: 11px solid transparent;
  border-bottom: 11px solid transparent;
  border-left: 19px solid rgba(255,255,255,.95);
  margin-left: 5px;
}
</style>
</head>
<body>
<div id="app">

  <!-- ═══ HEADER ═══ -->
  <div id="header">
    <div class="logo">SSS <em>run</em></div>
    <div class="score-pill">🍎 <b id="score-val">2 840</b> pts</div>
    <div class="avatar-wrap" id="avatar-btn">
      <div class="avatar-circle">J</div>
      <div class="lvl-badge">7</div>
    </div>
  </div>

  <!-- ═══ HEALTH BAR ═══ -->
  <div id="hp-wrap">
    <div class="hp-row">
      <span>❤️ Vida</span>
      <span id="hp-txt">78 / 100</span>
    </div>
    <div class="hp-track">
      <div class="hp-fill" id="hp-fill" style="width:78%"></div>
    </div>
  </div>

  <!-- ═══ TABS ═══ -->
  <div id="tabs">
    <div class="tab-pill-wrap">
      <button class="tab-pill active" data-tab="general">General</button>
      <button class="tab-pill"        data-tab="friends">Amigos</button>
    </div>
  </div>

  <!-- ═══ CONTENT ═══ -->
  <div id="content">
    <div id="map"></div>
    <div id="swipe-hint">← desliza para ver amigos</div>

    <!-- Friends / Groups panel -->
    <div id="friends-panel">
      <div class="fp-section" style="padding-top:18px">
        <div class="fp-title">En línea ahora</div>
        <div id="friends-list"></div>
      </div>
      <div class="fp-section" style="margin-top:6px; padding-bottom:20px">
        <div class="fp-title">Grupos</div>
        <div id="groups-list"></div>
      </div>
    </div>
  </div>

  <!-- ═══ BOTTOM NAV ═══ -->
  <div id="nav-area">

    <canvas id="snake-canvas"></canvas>

    <!--
      SVG nav bar  —  viewBox 430 × 88
      ─────────────────────────────────
      Fill path (white bar with notch):
        M 0,88  L 0,28
        L 179,28   ← left junction (x = 215 - 36)
        Q 196,4 215,4   ← left Bézier up to notch apex
        Q 234,4 251,28  ← right Bézier back down
        L 430,28  L 430,88  Z

      Snake top-edge path (open, left → right):
        M 0,28 L 179,28 Q 196,4 215,4 Q 234,4 251,28 L 430,28
    -->
    <svg id="nav-svg" viewBox="0 0 430 88" preserveAspectRatio="none"
         xmlns="http://www.w3.org/2000/svg">
      <defs>
        <filter id="nav-sh" x="-2%" y="-80%" width="104%" height="220%">
          <feDropShadow dx="0" dy="-3" stdDeviation="8"
                        flood-color="rgba(0,0,0,0.08)"/>
        </filter>
      </defs>
      <path
        d="M 0,88 L 0,28 L 179,28 Q 196,4 215,4 Q 234,4 251,28 L 430,28 L 430,88 Z"
        fill="white" filter="url(#nav-sh)"
      />
    </svg>

    <div id="nav-btns">
      <button class="nav-btn active" data-tab="general">
        <svg class="nav-icon" viewBox="0 0 24 24">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <span class="nav-label">Mapa</span>
      </button>
      <div class="nav-notch"></div>
      <button class="nav-btn" data-tab="leaderboard">
        <svg class="nav-icon" viewBox="0 0 24 24">
          <rect x="18" y="3"  width="4" height="18" rx="1"/>
          <rect x="10" y="8"  width="4" height="13" rx="1"/>
          <rect x="2"  y="13" width="4" height="8"  rx="1"/>
        </svg>
        <span class="nav-label">Top</span>
      </button>
    </div>

    <button id="play-btn" aria-label="Jugar">
      <div class="play-tri"></div>
    </button>
  </div>
</div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
'use strict';

/* ═══════════════════════════════════════════════════════
   DATA  —  hardcoded backend
═══════════════════════════════════════════════════════ */
const FRIENDS = [
  { name:'Jiajun', level:9,  score:3210, streak:7,  color:'#E67E22', status:'online',  food:52, speed:8 },
  { name:'Alicia', level:7,  score:2840, streak:5,  color:'#2980B9', status:'online',  food:38, speed:7 },
  { name:'Carlos', level:5,  score:1620, streak:3,  color:'#E74C3C', status:'offline', food:24, speed:6 },
  { name:'María',  level:11, score:4500, streak:12, color:'#8E44AD', status:'online',  food:71, speed:9 },
  { name:'Pau',    level:3,  score:980,  streak:1,  color:'#16A085', status:'offline', food:14, speed:5 },
];

const GROUPS = [
  { name:'Corredores UB',     emoji:'🏫', members:12, activeNow:3, joined:false },
  { name:'Amigos del Barrio', emoji:'🏘️', members:5,  activeNow:2, joined:true  },
  { name:'Snake Masters',     emoji:'🐍', members:8,  activeNow:5, joined:false },
  { name:'Night Runners',     emoji:'🌙', members:15, activeNow:0, joined:false },
  { name:'Campus Sprint',     emoji:'⚡', members:20, activeNow:7, joined:false },
];

const MAP_PLAYERS = [
  { name:'Jiajun', color:'#E67E22', lat:41.38670, lng:2.16980 },
  { name:'Alicia', color:'#2980B9', lat:41.38550, lng:2.16500 },
  { name:'Carlos', color:'#E74C3C', lat:41.38950, lng:2.17200 },
  { name:'María',  color:'#8E44AD', lat:41.38400, lng:2.16700 },
  { name:'Pau',    color:'#16A085', lat:41.38750, lng:2.16350 },
];

/* ═══════════════════════════════════════════════════════
   LEAFLET MAP
═══════════════════════════════════════════════════════ */
const map = L.map('map', {
  center: [41.3870, 2.1680],
  zoom: 16,
  zoomControl: false,
  attributionControl: true,
});

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© <a href="https://www.openstreetmap.org/copyright">OSM</a>',
  maxZoom: 19,
}).addTo(map);

/*
 * Each player:
 *  – circular head marker (DivIcon)
 *  – dashed colour trail polyline (last 22 positions)
 *  – random-walk with gentle steering noise
 */
const players = MAP_PLAYERS.map(p => {
  const trail = [[p.lat, p.lng]];

  const poly = L.polyline([[p.lat, p.lng]], {
    color: p.color, weight: 3, opacity: .50,
    dashArray: '7 5', lineCap: 'round',
  }).addTo(map);

  const el = document.createElement('div');
  el.innerHTML =
    `<div class="pm-head" style="border-color:${p.color};color:${p.color}">${p.name[0]}</div>`;

  const marker = L.marker([p.lat, p.lng], {
    icon: L.divIcon({ html: el, className: '', iconSize: [28,28], iconAnchor: [14,14] }),
    zIndexOffset: 100,
  }).addTo(map);

  marker.bindTooltip(`<b>${p.name}</b>`, { direction: 'top', offset: [0,-16] });

  return { marker, poly, trail,
    lat: p.lat, lng: p.lng,
    dlat: (Math.random()-.5) * .00012,
    dlng: (Math.random()-.5) * .00015 };
});

setInterval(() => {
  players.forEach(s => {
    s.dlat += (Math.random()-.5) * .000035;
    s.dlng += (Math.random()-.5) * .000045;
    s.dlat  = Math.max(-.00015, Math.min(.00015, s.dlat));
    s.dlng  = Math.max(-.00018, Math.min(.00018, s.dlng));
    s.lat  += s.dlat;
    s.lng  += s.dlng;
    if (s.lat > 41.397 || s.lat < 41.378) s.dlat *= -1;
    if (s.lng > 2.180  || s.lng < 2.156)  s.dlng *= -1;
    s.marker.setLatLng([s.lat, s.lng]);
    s.trail.push([s.lat, s.lng]);
    if (s.trail.length > 22) s.trail.shift();
    s.poly.setLatLngs(s.trail);
  });
}, 700);

/* ═══════════════════════════════════════════════════════
   RENDER FRIENDS + GROUPS
═══════════════════════════════════════════════════════ */
function renderFriends() {
  const el = document.getElementById('friends-list');
  el.innerHTML = '';
  const sorted = [...FRIENDS].sort(
    (a,b) => (a.status === 'online' ? 0 : 1) - (b.status === 'online' ? 0 : 1));

  sorted.forEach(f => {
    const on = f.status === 'online';
    const d  = document.createElement('div');
    d.className = 'friend-card';
    d.innerHTML = `
      <div class="fa-wrap">
        <div class="fa-circle"
             style="background:${f.color}18;border-color:${f.color};color:${f.color}">
          ${f.name[0]}
        </div>
        <div class="online-dot${on ? '' : ' off'}"></div>
      </div>
      <div class="fi">
        <div class="fi-name">${f.name}</div>
        <div class="fi-sub">
          <span>Nv.${f.level}</span>
          <span style="color:${on ? '#2ecc71':'#bbb'}">${on ? '● Jugando' : '○ Offline'}</span>
        </div>
      </div>
      <div class="chips">
        <div class="chip">🍎 ${f.food}</div>
        <div class="chip">⚡ ${f.speed}</div>
      </div>`;
    el.appendChild(d);
  });
}

function renderGroups() {
  const el = document.getElementById('groups-list');
  el.innerHTML = '';
  GROUPS.forEach(g => {
    const d = document.createElement('div');
    d.className = 'group-card';
    d.innerHTML = `
      <div class="gc-emoji">${g.emoji}</div>
      <div class="gc-info">
        <div class="gc-name">${g.name}</div>
        <div class="gc-meta">
          <span>👥 ${g.members}</span>
          <span class="${g.activeNow > 0 ? 'gc-active' : ''}">
            ${g.activeNow > 0 ? `● ${g.activeNow} activos` : '○ inactivo'}
          </span>
        </div>
      </div>
      <button class="join-btn${g.joined ? ' joined' : ''}">${g.joined ? 'Salir':'Unirse'}</button>`;
    d.querySelector('.join-btn').addEventListener('click', () => {
      g.joined = !g.joined;
      renderGroups();
    });
    el.appendChild(d);
  });
}

renderFriends();
renderGroups();

/* ═══════════════════════════════════════════════════════
   TABS + SWIPE
═══════════════════════════════════════════════════════ */
const fpanel    = document.getElementById('friends-panel');
const swipeHint = document.getElementById('swipe-hint');

function setTab(tab) {
  document.querySelectorAll('[data-tab]').forEach(el =>
    el.classList.toggle('active', el.dataset.tab === tab));
  fpanel.classList.toggle('visible', tab === 'friends');
  setTimeout(() => map.invalidateSize(), 320);
}

document.querySelectorAll('[data-tab]').forEach(el =>
  el.addEventListener('click', () => setTab(el.dataset.tab)));

// Swipe (touch + mouse drag)
const contentEl = document.getElementById('content');
let tx0 = 0, mx0 = 0, mdown = false;

contentEl.addEventListener('touchend',   e => {
  if (Math.abs(e.changedTouches[0].clientX - tx0) > 50)
    setTab(e.changedTouches[0].clientX < tx0 ? 'friends' : 'general');
}, { passive:true });
contentEl.addEventListener('mousedown',  e => { mx0 = e.clientX; mdown = true; });
window.addEventListener('mouseup', e => {
  if (!mdown) return;
  mdown = false;
  if (Math.abs(e.clientX - mx0) > 50) setTab(e.clientX < mx0 ? 'friends' : 'general');
});

/* ═══════════════════════════════════════════════════════
   SNAKE  —  follows the exact top-edge silhouette of the nav bar
   ──────────────────────────────────────────────────────
   Snake path (mirrors SVG fill top edge, viewBox 430×88):

     M 0,28  L 179,28
     Q 196,4 215,4        ←  left Bézier up to notch apex
     Q 234,4 251,28       ←  right Bézier back down
     L 430,28

   Technique:
     1. Sample the path into N_SAMPLES+1 canvas-pixel points.
     2. Each rAF advance headIdx by SPEED index units.
     3. Each body segment s sits segStep index units behind the previous.
     4. segStep is computed from SEG_GAP (px) / total path px length * N_SAMPLES,
        giving pixel-accurate spacing regardless of canvas width.
═══════════════════════════════════════════════════════ */
const canvas = document.getElementById('snake-canvas');
const ctx    = canvas.getContext('2d');

// Path that exactly mirrors the SVG notch top edge
const SNAKE_PATH_D =
  'M 0,28 L 179,28 Q 196,4 215,4 Q 234,4 251,28 L 430,28';

// Hidden SVG for path sampling
const NS   = 'http://www.w3.org/2000/svg';
const hsvg = document.createElementNS(NS, 'svg');
hsvg.style.cssText = 'position:absolute;width:0;height:0;opacity:0;pointer-events:none;overflow:hidden';
const hpath = document.createElementNS(NS, 'path');
hpath.setAttribute('d', SNAKE_PATH_D);
hsvg.appendChild(hpath);
document.body.appendChild(hsvg);

const TOTAL_LEN = hpath.getTotalLength();
const N_SAMPLES = 700;

// Snake parameters
const HEAD_R  = 7.5;   // head radius (px)
const SEG_R   = 5.2;   // body segment radius
const SEG_GAP = 13.5;  // physical gap between segment centres (px)
const N_BODY  = 13;    // body segments (excluding head)
const SPEED   = 0.75;  // path-index units per rAF

let pathPts  = [];
let segStep  = 20;     // re-computed on resize
let headIdx  = 0;
let bonusSegs = 0;
let apples    = [];

/* -- Build / rebuild sampled points and segStep -- */
function buildPath() {
  const sx = canvas.width  / 430;
  const sy = canvas.height / 88;
  pathPts  = [];
  for (let i = 0; i <= N_SAMPLES; i++) {
    const p = hpath.getPointAtLength((i / N_SAMPLES) * TOTAL_LEN);
    pathPts.push({ x: p.x * sx, y: p.y * sy });
  }
  // Total pixel length of the sampled path → derive index step per SEG_GAP px
  let totalPx = 0;
  for (let i = 1; i < pathPts.length; i++)
    totalPx += Math.hypot(pathPts[i].x - pathPts[i-1].x,
                          pathPts[i].y - pathPts[i-1].y);
  segStep = SEG_GAP / totalPx * N_SAMPLES;
}

function resizeCanvas() {
  canvas.width  = canvas.offsetWidth  || 430;
  canvas.height = canvas.offsetHeight || 88;
  buildPath();
}
window.addEventListener('resize', resizeCanvas);
setTimeout(resizeCanvas, 80);
setTimeout(resizeCanvas, 350);  // retry after first paint

/* -- Apple spawning -- */
function spawnApple() {
  // Stay off the notch zone (approx indices 165..535 for N_SAMPLES=700)
  let idx;
  do { idx = Math.floor(Math.random() * (N_SAMPLES + 1)); }
  while (idx > 160 && idx < 540);
  apples.push({ idx, eaten: false });
}
for (let i = 0; i < 4; i++) spawnApple();

/* -- Direction vector at a given path index -- */
function getDir(idx) {
  const i  = Math.round(idx);
  const i1 = Math.min(i + 3, N_SAMPLES);
  const i0 = Math.max(i - 3, 0);
  if (!pathPts[i0] || !pathPts[i1]) return { nx:1, ny:0, px:0, py:1 };
  const dx = pathPts[i1].x - pathPts[i0].x;
  const dy = pathPts[i1].y - pathPts[i0].y;
  const len = Math.hypot(dx, dy) || 1;
  return { nx: dx/len, ny: dy/len, px: -dy/len, py: dx/len };
}

/* -- Draw snake head with eyes and tongue -- */
function drawHead(x, y, idx) {
  const { nx, ny, px, py } = getDir(idx);

  // Body
  ctx.beginPath();
  ctx.arc(x, y, HEAD_R, 0, Math.PI * 2);
  ctx.fillStyle = '#2a9c2a';
  ctx.fill();

  // Eyes (symmetric about movement axis)
  const er = 2.4;
  [[-1], [1]].forEach(([s]) => {
    const ex = x + nx * HEAD_R * .38 + px * s * HEAD_R * .56;
    const ey = y + ny * HEAD_R * .38 + py * s * HEAD_R * .56;
    ctx.beginPath(); ctx.arc(ex, ey, er, 0, Math.PI*2);
    ctx.fillStyle = '#fff'; ctx.fill();
    ctx.beginPath(); ctx.arc(ex + nx*.9, ey + ny*.9, er*.58, 0, Math.PI*2);
    ctx.fillStyle = '#111'; ctx.fill();
  });

  // Tongue
  const tb = { x: x + nx * (HEAD_R - .3), y: y + ny * (HEAD_R - .3) };
  const tt = { x: tb.x + nx * 5.5,         y: tb.y + ny * 5.5 };
  ctx.strokeStyle = '#e53935'; ctx.lineWidth = 1.4; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(tb.x, tb.y); ctx.lineTo(tt.x, tt.y); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(tt.x, tt.y); ctx.lineTo(tt.x + nx*3.5 + px*3, tt.y + ny*3.5 + py*3);
  ctx.moveTo(tt.x, tt.y); ctx.lineTo(tt.x + nx*3.5 - px*3, tt.y + ny*3.5 - py*3);
  ctx.stroke();
}

/* -- Draw apple -- */
function drawApple(pt) {
  const r = SEG_R * .95;
  ctx.beginPath(); ctx.arc(pt.x, pt.y, r, 0, Math.PI*2);
  ctx.fillStyle = '#e53935'; ctx.fill();
  ctx.beginPath(); ctx.arc(pt.x - r*.30, pt.y - r*.28, r*.30, 0, Math.PI*2);
  ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.fill();
  ctx.strokeStyle = '#33691e'; ctx.lineWidth = 1.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(pt.x, pt.y - r); ctx.lineTo(pt.x + 2.5, pt.y - r - 4.5); ctx.stroke();
  ctx.fillStyle = '#56c75c';
  ctx.beginPath(); ctx.ellipse(pt.x + 3.5, pt.y - r - 3, 3.2, 1.5, -.55, 0, Math.PI*2); ctx.fill();
}

/* -- Main animation loop -- */
function snakeLoop() {
  requestAnimationFrame(snakeLoop);
  if (!pathPts.length) return;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  headIdx = (headIdx + SPEED) % (N_SAMPLES + 1);
  const hi = Math.round(headIdx);

  // Apple collision
  apples.forEach(a => {
    if (a.eaten || !pathPts[a.idx] || !pathPts[hi]) return;
    if (Math.hypot(pathPts[hi].x - pathPts[a.idx].x,
                   pathPts[hi].y - pathPts[a.idx].y) < HEAD_R + SEG_R * .85) {
      a.eaten = true;
      bonusSegs = Math.min(bonusSegs + 2, 10);
      setTimeout(spawnApple, 600);
    }
  });

  const total = N_BODY + bonusSegs;

  // Draw apples first (under snake)
  apples.filter(a => !a.eaten).forEach(a => {
    if (pathPts[a.idx]) drawApple(pathPts[a.idx]);
  });

  // Draw body tail→head  (head on top)
  for (let s = total; s >= 0; s--) {
    const raw = headIdx - s * segStep;
    const si  = Math.round(((raw % (N_SAMPLES+1)) + (N_SAMPLES+1)) % (N_SAMPLES+1));
    const pt  = pathPts[si];
    if (!pt) continue;

    if (s === 0) {
      drawHead(pt.x, pt.y, si);
    } else {
      const t = s / total;                    // 0 = near head, 1 = tail
      const r = SEG_R * (1 - t * .16);        // slight taper
      const g = Math.round(156 - t * 52);     // green gradient
      ctx.beginPath(); ctx.arc(pt.x, pt.y, r, 0, Math.PI*2);
      ctx.fillStyle = `rgb(42,${g},42)`; ctx.fill();
    }
  }
}

snakeLoop();
</script>
